server:
  port: 8080
  error:
    include-message: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: users-service

  datasource:
    url: jdbc:postgresql://localhost:5432/users_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration
