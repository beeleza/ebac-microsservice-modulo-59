server:
  port: 8083
  error:
    include-message: always
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
spring:
  application:
    name: notifications-service

  datasource:
    url: jdbc:postgresql://localhost:5435/notifications_service
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  flyway:
    enabled: true
    create-database: true
